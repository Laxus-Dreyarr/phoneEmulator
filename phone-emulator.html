<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultra HD Mobile Emulator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body {
      background: #090a0f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    /* Outer Wrapper for scaling without bitmap stretching */
    #phone-scaler {
      transform-origin: center center;
      will-change: transform;
    }

    #phone-container {
      perspective: 2000px;
      transform-origin: center center;
      display: inline-block;
      will-change: transform;
    }

    /* ----- PHONE FRAME ----- */
    #phone {
      width: 375px;
      height: 812px;
      background: #000;
      border-radius: 44px;
      padding: 12px;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.9), 0 0 0 2px #2a2a2a;
      position: relative;
      flex-shrink: 0;
    }

    /* Screen area */
    #screen {
      width: 100%;
      height: 100%;
      border-radius: 32px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Status bar */
    #status-bar {
      height: 44px;
      background: rgba(255, 255, 255, 0.98);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 14px;
      font-weight: 600;
      color: #222;
      border-bottom: 1px solid #e5e5e5;
      user-select: none;
      z-index: 20;
    }
    #status-bar .time { font-weight: 700; }
    #status-bar .icons { display: flex; gap: 6px; font-size: 15px; }

    /* Browser area */
    #browser {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f8f9fa;
      position: relative;
      overflow: hidden;
    }

    /* Address bar */
    #address-bar {
      display: flex;
      padding: 8px 12px;
      gap: 8px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      z-index: 20;
    }
    #address-bar input {
      flex: 1;
      padding: 8px 14px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
      background: #f1f3f4;
    }
    #address-bar button {
      padding: 0 16px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 
      ULTRA HD IFRAME WRAPPER 
      Renders the webview at double density (2x DPI) and shrinks it 
      with transform to force razor-sharp vector/font anti-aliasing.
    */
    #webview-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #webview {
      width: 200%;
      height: 200%;
      border: none;
      background: #fff;
      transform-origin: top left;
      transform: scale(0.5);
    }

    /* Home indicator */
    #home-indicator {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.98);
      z-index: 20;
    }
    #home-indicator .bar {
      width: 134px;
      height: 5px;
      background: #222;
      border-radius: 3px;
    }

    /* Notch */
    #notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 30px;
      background: #000;
      border-radius: 0 0 18px 18px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #notch .speaker { width: 40px; height: 4px; background: #222; border-radius: 2px; }
    #notch .camera { width: 8px; height: 8px; background: #111; border-radius: 50%; border: 1px solid #222; }

    /* Control Panel */
    #controls {
      position: fixed;
      bottom: 20px;
      background: rgba(25, 27, 40, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 24px;
      border-radius: 40px;
      display: flex;
      gap: 20px;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.12);
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    #controls label {
      color: #fff;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #controls input[type="range"] {
      width: 100px;
      accent-color: #007aff;
    }
    #controls button {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #2d2d44;
      color: #fff;
    }
    #controls button.active { background: #007aff; }

    /* Android Mode Override */
    #phone.android #notch { display: none; }
    #phone.android #home-indicator .bar { width: 48px; background: #666; }
  </style>
</head>
<body>

  <!-- Scaler Wrapper: Handles Size without destroying DPI -->
  <div id="phone-scaler">
    <div id="phone-container">
      <div id="phone" class="iphone">
        <div id="notch">
          <span class="speaker"></span>
          <span class="camera"></span>
        </div>
        <div id="screen">
          <div id="status-bar">
            <span class="time" id="clock">09:41</span>
            <span class="icons">📶 🔋</span>
          </div>
          <div id="browser">
            <div id="address-bar">
              <input type="text" id="url-input" placeholder="http://localhost:3000" />
              <button id="go-btn">Go</button>
            </div>
            <!-- HD Super-Sampling Container -->
            <div id="webview-container">
              <iframe id="webview" src="about:blank"></iframe>
            </div>
          </div>
          <div id="home-indicator">
            <div class="bar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Interactive Controls Panel -->
  <div id="controls">
    <button id="theme-iphone" class="active">iPhone</button>
    <button id="theme-android">Android</button>
    
    <label>Rotate:
      <input type="range" id="rotate-slider" min="-90" max="90" value="0" />
    </label>

    <label>Size:
      <input type="range" id="scale-slider" min="0.5" max="3.0" step="0.05" value="1.0" />
    </label>

    <label>Resolution:
      <button id="dpi-toggle" style="background:#007aff; padding:4px 12px;">2x HD</button>
    </label>

    <button id="reset-btn">Reset</button>
  </div>

  <script>
    (function() {
      const urlInput = document.getElementById('url-input');
      const goBtn = document.getElementById('go-btn');
      const webview = document.getElementById('webview');
      const phone = document.getElementById('phone');
      const themeIphone = document.getElementById('theme-iphone');
      const themeAndroid = document.getElementById('theme-android');
      const rotateSlider = document.getElementById('rotate-slider');
      const scaleSlider = document.getElementById('scale-slider');
      const dpiToggle = document.getElementById('dpi-toggle');
      const resetBtn = document.getElementById('reset-btn');
      const phoneContainer = document.getElementById('phone-container');
      const phoneScaler = document.getElementById('phone-scaler');

      let currentRot = 0;
      let userScale = 1.0;
      let manualSizeOverride = false;
      let dpiMultiplier = 2; // Default 2x HD Supersampling

      // HD Resolution Multiplier Logic
      function updateDpi() {
        if (dpiMultiplier === 1) {
          webview.style.width = '100%';
          webview.style.height = '100%';
          webview.style.transform = 'none';
          dpiToggle.textContent = '1x SD';
          dpiToggle.style.background = '#555';
        } else if (dpiMultiplier === 2) {
          webview.style.width = '200%';
          webview.style.height = '200%';
          webview.style.transform = 'scale(0.5)';
          dpiToggle.textContent = '2x HD';
          dpiToggle.style.background = '#007aff';
        } else if (dpiMultiplier === 3) {
          webview.style.width = '300%';
          webview.style.height = '300%';
          webview.style.transform = 'scale(0.333333)';
          dpiToggle.textContent = '3x Ultra HD';
          dpiToggle.style.background = '#34c759';
        }
      }

      dpiToggle.addEventListener('click', function() {
        dpiMultiplier = dpiMultiplier === 1 ? 2 : (dpiMultiplier === 2 ? 3 : 1);
        updateDpi();
      });

      function calculateAutoFitScale() {
        if (manualSizeOverride) return userScale;

        const phoneWidth = 375;
        const phoneHeight = 812;
        const margin = 160; 

        const scaleX = (window.innerWidth - margin) / phoneWidth;
        const scaleY = (window.innerHeight - margin) / phoneHeight;
        
        return Math.min(scaleX, scaleY);
      }

      function applyTransform() {
        const activeScale = manualSizeOverride ? userScale : calculateAutoFitScale();
        
        if (!manualSizeOverride) {
          scaleSlider.value = activeScale.toFixed(2);
        }

        // Apply scale to wrapper to prevent breaking frame perspective
        phoneScaler.style.transform = `scale(${activeScale})`;
        // Apply 3D rotation separately
        phoneContainer.style.transform = `rotateY(${currentRot}deg)`;
      }

      scaleSlider.addEventListener('input', function() {
        manualSizeOverride = true;
        userScale = parseFloat(this.value);
        applyTransform();
      });

      rotateSlider.addEventListener('input', function() {
        currentRot = parseInt(this.value, 10);
        applyTransform();
      });

      resetBtn.addEventListener('click', function() {
        manualSizeOverride = false;
        currentRot = 0;
        rotateSlider.value = 0;
        dpiMultiplier = 2;
        updateDpi();
        applyTransform();
      });

      function navigate() {
        let url = urlInput.value.trim();
        if (!url) return;
        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }
        webview.src = url;
      }

      goBtn.addEventListener('click', navigate);
      urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') navigate(); });

      themeIphone.addEventListener('click', () => {
        phone.classList.remove('android');
        themeIphone.classList.add('active');
        themeAndroid.classList.remove('active');
      });

      themeAndroid.addEventListener('click', () => {
        phone.classList.add('android');
        themeAndroid.classList.add('active');
        themeIphone.classList.remove('active');
      });

      window.addEventListener('resize', applyTransform);
      window.addEventListener('load', () => {
        updateDpi();
        applyTransform();
      });
    })();
  </script>
</body>
</html>
